name: omar-petclinic

# Local development stack. Secrets come from a .env file (see .env.example), never from this file.

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      # PostgreSQL 18+ stores data under a versioned subdirectory of /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    # No published port: only services on the internal network can reach the database
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    # start-dev: plain HTTP and embedded dev database. DEV ONLY - production uses `start` with TLS and an external DB.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required (see .env.example)}
      # Fixed public URL so the token issuer (iss) is identical for the browser, curl and the API container
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/omar-petclinic-realm.json:/opt/keycloak/data/import/omar-petclinic-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The image has no curl/wget: query the management port with bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    image: omar-petclinic:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://postgres:5432/petclinic
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      # Tokens are issued for http://localhost:8080 (KC_HOSTNAME); signing keys are fetched over the internal network
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/omar-petclinic
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/omar-petclinic/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Raised only in CI so the DAST scan is not throttled
      RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:-120}
      RATE_LIMIT_ANONYMOUS_PER_MINUTE: ${RATE_LIMIT_ANONYMOUS_PER_MINUTE:-30}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:9966:9966"
    networks: [backend]
    # Container hardening: immutable filesystem, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:

volumes:
  postgres_data:
