# active profiles config
#
# the application uses two active profiles
#
# one - for select database
# ------------------------------------------------
# When using HSQL, use: hsqldb
# When using MySQL, use: mysql
# When using PostgreSQL, use: postgres
# When using H2, use: h2
# ------------------------------------------------
#
# and one for selected repository layer
# ------------------------------------------------
# When using Spring jpa, use: jpa
# When using Spring JDBC, use: jdbc
# When using Spring Data JPA, use: spring-data-jpa
# ------------------------------------------------

spring.application.name=omar-petclinic

spring.profiles.active=h2,spring-data-jpa

# ------------------------------------------------

server.port=9966
server.servlet.context-path=/petclinic/

# Default database platform; can be overridden by other profile-specific property sources 
spring.sql.init.platform=h2
# Ensures schema & data reload on every restart (good for local dev)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/${spring.sql.init.platform}/schema.sql
spring.sql.init.data-locations=classpath*:db/${spring.sql.init.platform}/data.sql

spring.messages.basename=messages/messages
spring.jpa.open-in-view=false

# OpenAPI/Swagger UI (Defaults to true); set SWAGGER_UI_ENABLED=false in production to remove the docs attack surface
#springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
# springdoc hardcodes the Swagger UI webjar version it expects; keep it aligned with the overridden
# webjar (pom.xml swagger-ui.version, filtered by Maven) or every Swagger UI page returns 404
springdoc.swagger-ui.version=@swagger-ui.version@

logging.level.org.springframework=INFO
#logging.level.org.springframework=DEBUG

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------
# Security: OAuth2 resource server (Keycloak JWT)
# ------------------------------------------------
# Expected token issuer (iss) and allowed audience (aud): tokens from another realm or client are rejected
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/omar-petclinic}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:omar-petclinic-api}
# Signing keys are fetched here; it can differ from the issuer when the API reaches Keycloak over an internal network
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/omar-petclinic/protocol/openid-connect/certs}

# Comma-separated list of browser origins allowed to call the API; empty blocks all cross-origin calls
petclinic.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Rate limiting (requests per minute): per user when authenticated, per client IP otherwise
petclinic.rate-limit.authenticated-per-minute=${RATE_LIMIT_AUTHENTICATED_PER_MINUTE:120}
petclinic.rate-limit.anonymous-per-minute=${RATE_LIMIT_ANONYMOUS_PER_MINUTE:30}

# Actuator: expose only the health endpoint, without component details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Never return stack traces or internal messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

